services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnpy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpy}
      POSTGRES_DB: ${POSTGRES_DB:-learnpy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnpy} -d ${POSTGRES_DB:-learnpy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnpy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpy}
      POSTGRES_DB: ${POSTGRES_DB:-learnpy}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEBUG: "false"
    ports:
      - "${API_PORT:-8001}:8000"

volumes:
  pgdata:
